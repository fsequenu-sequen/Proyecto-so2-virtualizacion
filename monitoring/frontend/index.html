<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log de eventos — Robot Asistente</title>
  <style>
    :root {
      --bg: #07111f;
      --card: #101c2f;
      --accent: #7ecbff;
      --muted: #9aa7b8;
      --ok: #69f0ae;
      --err: #ff8a80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: #e8eef5;
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      background: var(--card);
      border-bottom: 1px solid #223049;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
    .actions { margin-left: auto; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button {
      background: #214c5f;
      color: var(--accent);
      border: 1px solid #2d5f78;
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .live {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .live.on { color: var(--ok); }
    main { padding: 1rem 1.25rem 2rem; max-width: 1100px; margin: 0 auto; }
    .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .status.err { color: var(--err); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #223049;
    }
    th, td { padding: 0.55rem 0.65rem; text-align: left; vertical-align: top; }
    th {
      background: #152238;
      color: var(--accent);
      font-weight: 600;
    }
    tr:nth-child(even) { background: rgba(0,0,0,0.12); }
    .mono { font-family: ui-monospace, monospace; font-size: 0.78rem; word-break: break-all; }
    .pill {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .pill.ok { background: rgba(105,240,174,0.15); color: var(--ok); }
    .pill.bad { background: rgba(255,138,128,0.15); color: var(--err); }
    .empty { padding: 2rem; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Dashboard — eventos del robot</h1>
    <span class="live" id="liveLabel">Actualización manual</span>
    <div class="actions">
      <button type="button" id="btnRefresh">Actualizar</button>
      <button type="button" id="btnToggleLive">Tiempo real: off</button>
    </div>
  </header>
  <main>
    <p class="status" id="status">Cargando…</p>
    <div id="tableWrap"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
